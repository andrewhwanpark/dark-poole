<!DOCTYPE html>
<html lang="en" data-theme="dark-poole">
  {% include head.html %}

  <body class="{% if page.layout %}{{ page.layout }}{% endif %}{% if page.title %} {{ page.title | slugify }}{% endif %}">
    <header class="masthead">
      <div class="masthead-container">
        <div class="masthead-title-container">
          <a class="title" href="{{ site.baseurl }}/" title="Home">{{ site.title }}</a>
          <div class="subtitle">{{ site.tagline }}</div>
        </div>

        <nav class="nav">
          {% for nav in site.nav %}
          <a class="title" href="{{ nav.url }}">{{ nav.title }}</a>
          {% endfor %}
        </nav>
      </div>
    </header>

    <div class="body-container">
      <div class="content">
        <main>
          {{ content }}
        </main>
      </div>

      <footer class="footer">
        <small>
          &copy;
          <time datetime="{{ site.time | date_to_xmlschema }}"
            >{{ site.time | date: '%Y' }}</time
          >. All rights reserved.
        </small>
      </footer>
    </div>

    {% if site.ga_analytics %}
    <script>
      (function (i, s, o, g, r, a, m) {
        i["GoogleAnalyticsObject"] = r;
        (i[r] =
          i[r] ||
          function () {
            (i[r].q = i[r].q || []).push(arguments);
          }),
          (i[r].l = 1 * new Date());
        (a = s.createElement(o)), (m = s.getElementsByTagName(o)[0]);
        a.async = 1;
        a.src = g;
        m.parentNode.insertBefore(a, m);
      })(
        window,
        document,
        "script",
        "https://www.google-analytics.com/analytics.js",
        "ga"
      );
      ga("create", "{{ site.ga_analytics }}", "auto");
      ga("send", "pageview");
    </script>
    {% endif %}
  </body>
</html>
